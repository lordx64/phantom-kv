[project]
name = "phantom-kv"
version = "0.1.0"
description = "Refusal removal as a loadable KV-cache graft — no weight edits, no refusal-direction projection, 100% of base weights byte-identical."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.51",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.scripts]
phantom-eval = "phantom_kv.cli:main"
phantom-graft = "phantom_kv.graft.cli:main"
phantom-train = "phantom_kv.train.cli:main"
phantom-chat = "phantom_kv.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom_kv"]
